<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><title>Del magma a la lava</title><defs><radialGradient id="globe" cx="32%" cy="27%" r="80%"><stop stop-color="#75c8d2"/><stop offset=".55" stop-color="#27778d"/><stop offset="1" stop-color="#0e3045"/></radialGradient><radialGradient id="mantle" cx="30%" cy="30%"><stop stop-color="#b78356"/><stop offset="1" stop-color="#76513e"/></radialGradient><radialGradient id="outer"><stop stop-color="#ffc264"/><stop offset="1" stop-color="#d66c32"/></radialGradient><radialGradient id="inner" cx="30%" cy="30%"><stop stop-color="#fff8ba"/><stop offset="1" stop-color="#efb63b"/></radialGradient><linearGradient id="rock" x2="1" y2="1"><stop stop-color="#bba78c"/><stop offset="1" stop-color="#675849"/></linearGradient><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#162f46"/><stop offset="1" stop-color="#4d9cac"/></linearGradient></defs><rect width="1536" height="1024" fill="#102f37"/><g font-family="DejaVu Sans, sans-serif"><text x="70" y="65" fill="#d3f76b" font-size="17" font-weight="normal" text-anchor="start">MISIÓN GAIA / CUADERNO VISUAL</text><text x="70" y="125" fill="#e9f0e6" font-size="46" font-weight="bold" text-anchor="start">Del magma a la lava</text><text x="70" y="175" fill="#a5bdb8" font-size="23" font-weight="normal" text-anchor="start">Un mismo material cambia de nombre cuando llega al exterior.</text><rect x="210" y="765" width="1110" height="135" rx="0" fill="url(#rock)"/><path d="M240 765 L560 347 Q623 380 680 347 L1240 765Z" fill="url(#rock)" stroke="#c0ac91" stroke-width="3"/><polyline points="280,745 610,725 1070,755" fill="none" stroke="#cbb596" stroke-width="3" /><polyline points="330,710 610,690 1070,720" fill="none" stroke="#cbb596" stroke-width="3" /><polyline points="385,675 610,655 1070,685" fill="none" stroke="#cbb596" stroke-width="3" /><polyline points="440,635 610,615 1070,645" fill="none" stroke="#cbb596" stroke-width="3" /><polyline points="480,595 610,575 1070,605" fill="none" stroke="#cbb596" stroke-width="3" /><path d="M620 835 Q595 700 627 560 Q642 457 622 372" fill="none" stroke="#aa3526" stroke-width="38"/><path d="M620 835 Q595 700 627 560 Q642 457 622 372" fill="none" stroke="#ffb558" stroke-width="17"/><ellipse cx="620" cy="838" rx="140" ry="42" fill="url(#outer)"/><path d="M673 365 Q720 392 760 431 Q790 492 855 515 Q924 586 1037 655" fill="none" stroke="#f2a257" stroke-width="15"/><path d="M561 347 Q620 390 680 347" fill="none" stroke="#493f36" stroke-width="10"/><circle cx="620" cy="310" r="30" fill="#b5b6ae" stroke="none" stroke-width="1"/><circle cx="610" cy="260" r="40" fill="#b5b6ae" stroke="none" stroke-width="1"/><circle cx="645" cy="233" r="36" fill="#b5b6ae" stroke="none" stroke-width="1"/><circle cx="580" cy="231" r="25" fill="#b5b6ae" stroke="none" stroke-width="1"/><rect x="60" y="750" width="365" height="125" rx="12" fill="#102f37"/><rect x="1090" y="738" width="420" height="125" rx="12" fill="#102f37"/><polyline points="615,837 390,846 105,846" fill="none" stroke="#a5bdb8" stroke-width="3" /><text x="75" y="790" fill="#e9f0e6" font-size="28" font-weight="bold" text-anchor="start">Magma</text><text x="75" y="826" fill="#a5bdb8" font-size="20" font-weight="normal" text-anchor="start">Roca fundida en el interior.</text><polyline points="623,570 405,550 110,550" fill="none" stroke="#a5bdb8" stroke-width="3" /><text x="75" y="500" fill="#e9f0e6" font-size="28" font-weight="bold" text-anchor="start">Chimenea</text><text x="75" y="536" fill="#a5bdb8" font-size="20" font-weight="normal" text-anchor="start">Conducto de ascenso.</text><polyline points="622,365 855,300 1040,300" fill="none" stroke="#a5bdb8" stroke-width="3" /><text x="1050" y="275" fill="#e9f0e6" font-size="28" font-weight="bold" text-anchor="start">Cráter</text><text x="1050" y="311" fill="#a5bdb8" font-size="20" font-weight="normal" text-anchor="start">Abertura de salida.</text><polyline points="850,515 1060,470 1140,470" fill="none" stroke="#a5bdb8" stroke-width="3" /><text x="1150" y="440" fill="#e9f0e6" font-size="28" font-weight="bold" text-anchor="start">Lava</text><text x="1150" y="476" fill="#a5bdb8" font-size="20" font-weight="normal" text-anchor="start">Magma en el exterior.</text><polyline points="1030,690 1190,710 1260,710" fill="none" stroke="#a5bdb8" stroke-width="3" /><text x="1110" y="770" fill="#e9f0e6" font-size="28" font-weight="bold" text-anchor="start">Cono volcánico</text><text x="1110" y="806" fill="#a5bdb8" font-size="20" font-weight="normal" text-anchor="start">Materiales acumulados.</text><polyline points="70,934 1466,934" fill="none" stroke="#35535a" stroke-width="1" /><text x="70" y="978" fill="#a5bdb8" font-size="18" font-weight="normal" text-anchor="start">Esquema didáctico. Tamaños, grosores y distancias no están a escala.</text></g></svg>