<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><title>Un viaje al centro de la Tierra</title><defs><radialGradient id="globe" cx="32%" cy="27%" r="80%"><stop stop-color="#75c8d2"/><stop offset=".55" stop-color="#27778d"/><stop offset="1" stop-color="#0e3045"/></radialGradient><radialGradient id="mantle" cx="30%" cy="30%"><stop stop-color="#b78356"/><stop offset="1" stop-color="#76513e"/></radialGradient><radialGradient id="outer"><stop stop-color="#ffc264"/><stop offset="1" stop-color="#d66c32"/></radialGradient><radialGradient id="inner" cx="30%" cy="30%"><stop stop-color="#fff8ba"/><stop offset="1" stop-color="#efb63b"/></radialGradient><linearGradient id="rock" x2="1" y2="1"><stop stop-color="#bba78c"/><stop offset="1" stop-color="#675849"/></linearGradient><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#162f46"/><stop offset="1" stop-color="#4d9cac"/></linearGradient></defs><rect width="1536" height="1024" fill="#102f37"/><g font-family="DejaVu Sans, sans-serif"><text x="70" y="65" fill="#d3f76b" font-size="17" font-weight="normal" text-anchor="start">MISIÓN GAIA / CUADERNO VISUAL</text><text x="70" y="125" fill="#e9f0e6" font-size="46" font-weight="bold" text-anchor="start">Un viaje al centro de la Tierra</text><text x="70" y="175" fill="#a5bdb8" font-size="23" font-weight="normal" text-anchor="start">La geosfera se organiza en corteza, manto y núcleo.</text><circle cx="490" cy="540" r="325" fill="#98c2b4" stroke="none" stroke-width="1"/><circle cx="490" cy="540" r="314" fill="url(#mantle)" stroke="none" stroke-width="1"/><circle cx="490" cy="540" r="175" fill="url(#outer)" stroke="none" stroke-width="1"/><circle cx="490" cy="540" r="70" fill="url(#inner)" stroke="none" stroke-width="1"/><polyline points="755,352 850,280 930,280" fill="none" stroke="#a5bdb8" stroke-width="3" /><circle cx="755" cy="352" r="5" fill="#d3f76b" stroke="none" stroke-width="1"/><text x="950" y="290" fill="#e9f0e6" font-size="29" font-weight="bold" text-anchor="start">Corteza</text><text x="950" y="328" fill="#a5bdb8" font-size="21" font-weight="normal" text-anchor="start">Externa y delgada.</text><text x="950" y="358" fill="#a5bdb8" font-size="21" font-weight="normal" text-anchor="start">Continental y oceánica.</text><polyline points="690,490 850,435 930,435" fill="none" stroke="#a5bdb8" stroke-width="3" /><circle cx="690" cy="490" r="5" fill="#d3f76b" stroke="none" stroke-width="1"/><text x="950" y="445" fill="#e9f0e6" font-size="29" font-weight="bold" text-anchor="start">Manto</text><text x="950" y="483" fill="#a5bdb8" font-size="21" font-weight="normal" text-anchor="start">Intermedio y el más grueso.</text><text x="950" y="513" fill="#a5bdb8" font-size="21" font-weight="normal" text-anchor="start">Roca principalmente sólida.</text><polyline points="625,610 850,595 930,595" fill="none" stroke="#a5bdb8" stroke-width="3" /><circle cx="625" cy="610" r="5" fill="#d3f76b" stroke="none" stroke-width="1"/><text x="950" y="605" fill="#e9f0e6" font-size="29" font-weight="bold" text-anchor="start">Núcleo externo</text><text x="950" y="643" fill="#a5bdb8" font-size="21" font-weight="normal" text-anchor="start">Metálico y líquido.</text><polyline points="490,540 850,750 930,750" fill="none" stroke="#a5bdb8" stroke-width="3" /><circle cx="490" cy="540" r="5" fill="#d3f76b" stroke="none" stroke-width="1"/><text x="950" y="760" fill="#e9f0e6" font-size="29" font-weight="bold" text-anchor="start">Núcleo interno</text><text x="950" y="798" fill="#a5bdb8" font-size="21" font-weight="normal" text-anchor="start">Metálico y sólido.</text><polyline points="70,934 1466,934" fill="none" stroke="#35535a" stroke-width="1" /><text x="70" y="978" fill="#a5bdb8" font-size="18" font-weight="normal" text-anchor="start">Corte esquemático sin escala. El núcleo contiene metales como hierro y níquel.</text></g></svg>