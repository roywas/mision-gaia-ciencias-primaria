<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><title>Cinco capas para explorar</title><defs><radialGradient id="globe" cx="32%" cy="27%" r="80%"><stop stop-color="#75c8d2"/><stop offset=".55" stop-color="#27778d"/><stop offset="1" stop-color="#0e3045"/></radialGradient><radialGradient id="mantle" cx="30%" cy="30%"><stop stop-color="#b78356"/><stop offset="1" stop-color="#76513e"/></radialGradient><radialGradient id="outer"><stop stop-color="#ffc264"/><stop offset="1" stop-color="#d66c32"/></radialGradient><radialGradient id="inner" cx="30%" cy="30%"><stop stop-color="#fff8ba"/><stop offset="1" stop-color="#efb63b"/></radialGradient><linearGradient id="rock" x2="1" y2="1"><stop stop-color="#bba78c"/><stop offset="1" stop-color="#675849"/></linearGradient><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#162f46"/><stop offset="1" stop-color="#4d9cac"/></linearGradient></defs><rect width="1536" height="1024" fill="#102f37"/><g font-family="DejaVu Sans, sans-serif"><text x="70" y="65" fill="#d3f76b" font-size="17" font-weight="normal" text-anchor="start">MISIÓN GAIA / CUADERNO VISUAL</text><text x="70" y="125" fill="#e9f0e6" font-size="46" font-weight="bold" text-anchor="start">Cinco capas para explorar</text><text x="70" y="175" fill="#a5bdb8" font-size="23" font-weight="normal" text-anchor="start">Sube desde la superficie: TRO → ES → MES → TER → EX.</text><rect x="100" y="225" width="1336" height="115" rx="9" fill="#172a42"/><text x="135" y="270" fill="#e9f0e6" font-size="30" font-weight="bold" text-anchor="start">Exosfera</text><text x="135" y="309" fill="#e9f0e6" font-size="24" font-weight="normal" text-anchor="start">La más exterior; casi sin gases.</text><rect x="100" y="348" width="1336" height="115" rx="9" fill="#264969"/><text x="135" y="393" fill="#e9f0e6" font-size="30" font-weight="bold" text-anchor="start">Termosfera</text><text x="135" y="432" fill="#e9f0e6" font-size="24" font-weight="normal" text-anchor="start">Muy caliente; aquí se producen auroras.</text><rect x="100" y="471" width="1336" height="115" rx="9" fill="#3c6d86"/><text x="135" y="516" fill="#e9f0e6" font-size="30" font-weight="bold" text-anchor="start">Mesosfera</text><text x="135" y="555" fill="#e9f0e6" font-size="24" font-weight="normal" text-anchor="start">Muy fría; se desintegran muchos meteoros.</text><rect x="100" y="594" width="1336" height="115" rx="9" fill="#5194ad"/><text x="135" y="639" fill="#e9f0e6" font-size="30" font-weight="bold" text-anchor="start">Estratosfera</text><text x="135" y="678" fill="#e9f0e6" font-size="24" font-weight="normal" text-anchor="start">Contiene la capa de ozono, que filtra radiación UV.</text><rect x="100" y="717" width="1336" height="115" rx="9" fill="#77b9c9"/><text x="135" y="762" fill="#e9f0e6" font-size="30" font-weight="bold" text-anchor="start">Troposfera</text><text x="135" y="801" fill="#e9f0e6" font-size="24" font-weight="normal" text-anchor="start">Vivimos aquí; lluvia, viento y otros fenómenos.</text><rect x="100" y="848" width="1336" height="52" rx="8" fill="#5b8271"/><text x="768" y="882" fill="#e9f0e6" font-size="22" font-weight="bold" text-anchor="middle">SUPERFICIE TERRESTRE</text><polyline points="70,934 1466,934" fill="none" stroke="#35535a" stroke-width="1" /><text x="70" y="978" fill="#a5bdb8" font-size="18" font-weight="normal" text-anchor="start">Esquema sin escala: las alturas y el grosor de las franjas no representan tamaños reales.</text></g></svg>