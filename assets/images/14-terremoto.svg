<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><title>¿Dónde empieza un terremoto?</title><defs><radialGradient id="globe" cx="32%" cy="27%" r="80%"><stop stop-color="#75c8d2"/><stop offset=".55" stop-color="#27778d"/><stop offset="1" stop-color="#0e3045"/></radialGradient><radialGradient id="mantle" cx="30%" cy="30%"><stop stop-color="#b78356"/><stop offset="1" stop-color="#76513e"/></radialGradient><radialGradient id="outer"><stop stop-color="#ffc264"/><stop offset="1" stop-color="#d66c32"/></radialGradient><radialGradient id="inner" cx="30%" cy="30%"><stop stop-color="#fff8ba"/><stop offset="1" stop-color="#efb63b"/></radialGradient><linearGradient id="rock" x2="1" y2="1"><stop stop-color="#bba78c"/><stop offset="1" stop-color="#675849"/></linearGradient><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#162f46"/><stop offset="1" stop-color="#4d9cac"/></linearGradient></defs><rect width="1536" height="1024" fill="#102f37"/><g font-family="DejaVu Sans, sans-serif"><text x="70" y="65" fill="#d3f76b" font-size="17" font-weight="normal" text-anchor="start">MISIÓN GAIA / CUADERNO VISUAL</text><text x="70" y="125" fill="#e9f0e6" font-size="46" font-weight="bold" text-anchor="start">¿Dónde empieza un terremoto?</text><text x="70" y="175" fill="#a5bdb8" font-size="23" font-weight="normal" text-anchor="start">Hipocentro dentro. Epicentro encima, en la superficie.</text><rect x="220" y="435" width="900" height="430" rx="0" fill="url(#rock)"/><rect x="220" y="415" width="900" height="25" rx="0" fill="#83a582"/><polyline points="220,505 1120,515" fill="none" stroke="#c5af91" stroke-width="3" /><polyline points="220,570 1120,580" fill="none" stroke="#c5af91" stroke-width="3" /><polyline points="220,650 1120,660" fill="none" stroke="#c5af91" stroke-width="3" /><polyline points="220,740 1120,750" fill="none" stroke="#c5af91" stroke-width="3" /><polyline points="220,820 1120,830" fill="none" stroke="#c5af91" stroke-width="3" /><path d="M520 865 L625 710 L680 600 L765 435" fill="none" stroke="#614e43" stroke-width="8"/><circle cx="625" cy="710" r="65" fill="none" stroke="#eccd95" stroke-width="3"/><circle cx="625" cy="710" r="125" fill="none" stroke="#eccd95" stroke-width="3"/><circle cx="625" cy="710" r="180" fill="none" stroke="#eccd95" stroke-width="3"/><polyline points="625,710 625,425" fill="none" stroke="#d3f76b" stroke-width="3" stroke-dasharray="8 9"/><circle cx="625" cy="710" r="14" fill="#ffb25d" stroke="none" stroke-width="1"/><circle cx="625" cy="425" r="12" fill="#d3f76b" stroke="none" stroke-width="1"/><polyline points="625,425 790,330 1000,330" fill="none" stroke="#a5bdb8" stroke-width="3" /><text x="1020" y="325" fill="#e9f0e6" font-size="32" font-weight="bold" text-anchor="start">Epicentro</text><text x="1020" y="366" fill="#a5bdb8" font-size="23" font-weight="normal" text-anchor="start">En la superficie,</text><text x="1020" y="399" fill="#a5bdb8" font-size="23" font-weight="normal" text-anchor="start">sobre el hipocentro.</text><polyline points="625,710 985,750 1150,750" fill="none" stroke="#a5bdb8" stroke-width="3" /><text x="1170" y="705" fill="#e9f0e6" font-size="30" font-weight="bold" text-anchor="start">Hipocentro</text><text x="1170" y="748" fill="#a5bdb8" font-size="22" font-weight="normal" text-anchor="start">Origen en el</text><text x="1170" y="782" fill="#a5bdb8" font-size="22" font-weight="normal" text-anchor="start">interior terrestre.</text><text x="235" y="360" fill="#a5bdb8" font-size="22" font-weight="normal" text-anchor="start">Superficie terrestre</text><text x="250" y="920" fill="#d3f76b" font-size="24" font-weight="normal" text-anchor="start">Las ondas se propagan desde el hipocentro.</text><polyline points="70,934 1466,934" fill="none" stroke="#35535a" stroke-width="1" /><text x="70" y="978" fill="#a5bdb8" font-size="18" font-weight="normal" text-anchor="start">Esquema didáctico. Tamaños, grosores y distancias no están a escala.</text></g></svg>